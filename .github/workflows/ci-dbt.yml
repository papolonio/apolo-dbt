name: CI dbt

on:
  pull_request:
    paths:
      - '**'
      - '!README.md'

jobs:
  dbt-build-test:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      DBT_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DBT_DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBT_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_DEV_SCHEMA: ci_pr_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-databricks
        run: pip install dbt-databricks

      - name: dbt deps
        run: dbt deps

      - name: Validar tags de tier (transform_job_geral vs transform_job_frequente)
        run: python scripts/validate_tiers.py

      - name: dbt build
        run: dbt build --target dev
